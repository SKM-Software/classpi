<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassPi</title>
<link rel="stylesheet" href="/css/classpi.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* ------------------------------------------------------------ top panel */
  .panel-top {
    display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px;
    background: rgba(14, 19, 32, .96); border-bottom: 1px solid var(--line);
    position: relative; z-index: 30; flex: 0 0 auto;
  }
  .start {
    display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; font-weight: 700; font-size: 14px; color: var(--text);
  }
  .start:hover, .start:focus-visible, .start.on { border-color: var(--accent); outline: none; }
  .start.on { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
  .logo-xs {
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b1a2a; font-weight: 800; font-size: 9px; letter-spacing: .4px;
  }
  .tb-device { font-weight: 600; color: var(--muted); font-size: 13px; }
  .tb-spacer { flex: 1; }
  .tb-host { color: var(--muted); font-size: 12px; }
  .tb-clock { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tb-clock span { font-weight: 400; color: var(--muted); margin-right: 10px; }

  /* ------------------------------------------------------------ desktop */
  .desktop {
    position: relative; flex: 1; min-height: 0;
    background:
      radial-gradient(1100px 650px at 18% -8%, #1d2a4a 0%, transparent 60%),
      radial-gradient(900px 600px at 88% 110%, #14324a 0%, transparent 55%),
      var(--bg);
    display: grid; place-items: center;
  }
  .watermark { text-align: center; user-select: none; opacity: .5; }
  .wm-logo {
    width: 110px; height: 110px; margin: 0 auto 18px; border-radius: 28px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-weight: 800; font-size: 40px;
    letter-spacing: 1px; color: #0b1a2a; box-shadow: 0 16px 50px rgba(79, 209, 165, .22);
  }
  .wm-title { font-size: 38px; font-weight: 800; letter-spacing: -.5px; }
  .wm-sub { color: var(--muted); font-size: 19px; margin-top: 6px; }
  .wm-hint { color: var(--muted); font-size: 15px; margin-top: 26px; }

  /* ------------------------------------------------------------ menus */
  .dropdown {
    position: absolute; z-index: 40; padding: 5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
  }
  .dropdown.closed { display: none; }
  #menu { top: 50px; left: 8px; width: 230px; }
  #submenu { width: 270px; }

  .menu-brand {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px 9px;
    border-bottom: 1px solid var(--line); margin-bottom: 5px;
    color: var(--muted); font-size: 12px;
  }
  .menu-brand b { color: var(--text); font-size: 13px; }

  .mi {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px;
    border-radius: 7px; cursor: pointer; font-size: 15px; font-weight: 600;
    color: var(--text); text-decoration: none;
  }
  .mi .ic { flex: 0 0 20px; width: 20px; height: 20px; display: grid; place-items: center; color: var(--c, var(--muted)); }
  .mi .ic svg { width: 18px; height: 18px; }
  .mi .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mi .chev { color: var(--muted); font-size: 11px; }
  .mi .kbd { font-size: 11px; padding: 1px 5px; }
  .mi.sel { background: color-mix(in srgb, var(--c, var(--accent)) 18%, var(--panel-2)); }
  .mi small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<div class="panel-top">
  <button class="start" id="startBtn" aria-haspopup="true" aria-expanded="false">
    <span class="logo-xs">SKM</span> Menu
  </button>
  <span class="tb-device" id="tbDevice"></span>
  <div class="tb-spacer"></div>
  <span class="tb-host" id="host"></span>
  <div class="tb-clock"><span id="date"></span><b id="time">--:--</b></div>
</div>

<div class="desktop" id="desktop">
  <div class="watermark">
    <div class="wm-logo">SKM</div>
    <div class="wm-title">SKM Software</div>
    <div class="wm-sub" id="wmSub">ClassPi OS &middot; Computing Science</div>
    <div class="wm-hint"><span class="kbd">Esc</span> opens the menu &middot; <span class="kbd">&uarr;</span><span class="kbd">&darr;</span><span class="kbd">&rarr;</span> to browse &middot; <span class="kbd">1</span>-<span class="kbd">7</span> open a tool directly</div>
  </div>
</div>

<nav class="dropdown closed" id="menu" aria-label="Applications"></nav>
<nav class="dropdown closed" id="submenu"></nav>

<script src="/js/common.js"></script>
<script>
const ICONS = {
  code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 6 2 12 8 18"/><polyline points="16 6 22 12 16 18"/></svg>',
  binary: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="6" height="16" rx="3"/><line x1="16" y1="4" x2="16" y2="20"/><polyline points="13 7 16 4"/></svg>',
  bars: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="20" x2="5" y2="12"/><line x1="10" y1="20" x2="10" y2="6"/><line x1="15" y1="20" x2="15" y2="14"/><line x1="20" y1="20" x2="20" y2="9"/></svg>',
  net: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="7" height="6" rx="1"/><rect x="15" y="3" width="7" height="6" rx="1"/><rect x="8.5" y="15" width="7" height="6" rx="1"/><path d="M5.5 9v3h13V9M12 12v3"/></svg>',
  quiz: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>',
  timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><polyline points="12 9 12 13 15 15"/><line x1="9" y1="2" x2="15" y2="2"/></svg>',
  sys: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="2" x2="9" y2="5"/><line x1="15" y1="2" x2="15" y2="5"/><line x1="9" y1="19" x2="9" y2="22"/><line x1="15" y1="19" x2="15" y2="22"/><line x1="2" y1="9" x2="5" y2="9"/><line x1="2" y1="15" x2="5" y2="15"/><line x1="19" y1="9" x2="22" y2="9"/><line x1="19" y1="15" x2="22" y2="15"/></svg>',
};

// key = the global 1-7 shortcut, kept stable across the menu layout
const APPS = [
  { key: 1, href: "/apps/python.html",     c: "#4fd1a5", name: "Python Lab",           desc: "Write, run and save Python programs",     icon: ICONS.code },
  { key: 2, href: "/apps/binary.html",     c: "#5b9dff", name: "Binary Trainer",       desc: "Binary, denary and two's complement",     icon: ICONS.binary },
  { key: 3, href: "/apps/algorithms.html", c: "#c792ea", name: "Algorithm Visualiser", desc: "Step through the standard algorithms",    icon: ICONS.bars },
  { key: 4, href: "/apps/network.html",    c: "#63d3ff", name: "Network Lab",          desc: "Messages, interception and encryption",   icon: ICONS.net },
  { key: 5, href: "/apps/quiz.html",       c: "#ffb547", name: "Revision Quiz",        desc: "N5 and Higher questions by topic",        icon: ICONS.quiz },
  { key: 6, href: "/apps/timer.html",      c: "#ff7eb6", name: "Timer & Picker",       desc: "Lesson countdown and name picker",        icon: ICONS.timer },
  { key: 7, href: "/apps/system.html",     c: "#9aa7c2", name: "System",               desc: "Pi health, updates and power",            icon: ICONS.sys },
];

const CATS = [
  { name: "Programming", c: "#4fd1a5", icon: ICONS.code,   items: [0, 2] },
  { name: "Data",        c: "#5b9dff", icon: ICONS.binary, items: [1] },
  { name: "Networking",  c: "#63d3ff", icon: ICONS.net,    items: [3] },
  { name: "Revision",    c: "#ffb547", icon: ICONS.quiz,   items: [4] },
  { name: "Classroom",   c: "#ff7eb6", icon: ICONS.timer,  items: [5] },
  { name: "System",      c: "#9aa7c2", icon: ICONS.sys,    items: [6] },
];

const $ = (id) => document.getElementById(id);
const menuEl = $("menu"), subEl = $("submenu");
let open = false, mode = "root", catSel = 0, subSel = 0, catRows = [], subRows = [];

menuEl.innerHTML = '<div class="menu-brand"><span class="logo-xs">SKM</span><span><b>SKM Software</b> &middot; ClassPi OS</span></div>';
CATS.forEach((cat, i) => {
  const el = document.createElement("div");
  el.className = "mi";
  el.style.setProperty("--c", cat.c);
  el.innerHTML = `<span class="ic">${cat.icon}</span><span class="grow">${cat.name}</span><span class="chev">&#9656;</span>`;
  el.addEventListener("mouseenter", () => { mode = "root"; selectCat(i); });
  el.addEventListener("click", (e) => { e.stopPropagation(); enterSub(); });
  menuEl.appendChild(el);
  catRows.push(el);
});

function selectCat(i) {
  catSel = (i + CATS.length) % CATS.length;
  catRows.forEach((el, j) => el.classList.toggle("sel", j === catSel));
  try { sessionStorage.setItem("classpi-cat", catSel); } catch (_) {}
  renderSub(catSel);
}

function renderSub(ci) {
  const cat = CATS[ci];
  subEl.innerHTML = "";
  subRows = [];
  cat.items.forEach((ai, j) => {
    const a = APPS[ai];
    const el = document.createElement("a");
    el.className = "mi";
    el.href = a.href;
    el.style.setProperty("--c", a.c);
    el.innerHTML = `<span class="ic">${a.icon}</span>
      <span class="grow">${a.name}<small>${a.desc}</small></span>
      <span class="kbd">${a.key}</span>`;
    el.addEventListener("mouseenter", () => { mode = "sub"; selectSub(j); });
    subEl.appendChild(el);
    subRows.push(el);
  });
  subEl.classList.remove("closed");
  // Cascade to the right of the hovered category, clamped to the viewport.
  const m = menuEl.getBoundingClientRect();
  const r = catRows[ci].getBoundingClientRect();
  subEl.style.left = (m.right - 4) + "px";
  const top = Math.min(r.top - 5, window.innerHeight - subEl.offsetHeight - 8);
  subEl.style.top = Math.max(8, top) + "px";
  subSel = -1;
  markSub();
}

function selectSub(i) {
  subSel = (i + subRows.length) % subRows.length;
  markSub();
}
function markSub() { subRows.forEach((el, j) => el.classList.toggle("sel", j === subSel)); }

function enterSub() { mode = "sub"; if (subSel < 0) selectSub(0); }
function backToRoot() { mode = "root"; subSel = -1; markSub(); }

function setMenu(o) {
  open = o;
  menuEl.classList.toggle("closed", !o);
  $("startBtn").classList.toggle("on", o);
  $("startBtn").setAttribute("aria-expanded", o);
  if (o) { mode = "root"; selectCat(catSel); }
  else subEl.classList.add("closed");
}
$("startBtn").addEventListener("click", (e) => { e.stopPropagation(); setMenu(!open); });
$("desktop").addEventListener("click", () => setMenu(false));

document.addEventListener("keydown", (e) => {
  if (/^[1-7]$/.test(e.key)) { location.href = APPS[e.key - 1].href; return; }
  if (e.key === "Escape" || e.key === "Meta") { e.preventDefault(); setMenu(!open); return; }
  if (!open) {
    if (["Enter", "ArrowDown", "ArrowUp", "ArrowRight", "ArrowLeft"].includes(e.key)) { e.preventDefault(); setMenu(true); }
    return;
  }
  if (mode === "root") {
    if (e.key === "ArrowDown") selectCat(catSel + 1);
    else if (e.key === "ArrowUp") selectCat(catSel - 1);
    else if (e.key === "ArrowRight" || e.key === "Enter") enterSub();
    else return;
  } else {
    if (e.key === "ArrowDown") selectSub(subSel + 1);
    else if (e.key === "ArrowUp") selectSub(subSel - 1);
    else if (e.key === "ArrowLeft") backToRoot();
    else if (e.key === "Enter") { if (subRows[subSel]) location.href = subRows[subSel].href; }
    else return;
  }
  e.preventDefault();
});

function tick() {
  const now = new Date();
  $("time").textContent = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = now.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
}
tick(); setInterval(tick, 1000);

api("/api/info").then((i) => {
  $("tbDevice").textContent = i.device_name + " · " + i.school_name;
  $("wmSub").textContent = "ClassPi OS · " + i.school_name;
  $("host").textContent = i.hostname + " · ClassPi OS " + i.version;
  document.title = i.device_name;
}).catch(() => {});

try { catSel = Number(sessionStorage.getItem("classpi-cat") || 0) % CATS.length; } catch (_) {}
setMenu(true);   // menu open on arrival so the tools are one keypress away
</script>
</body>
</html>
