<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassPi</title>
<link rel="stylesheet" href="/css/classpi.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* ------------------------------------------------------------ desktop */
  .desktop {
    position: relative; flex: 1; min-height: 0;
    background:
      radial-gradient(1100px 650px at 18% -8%, #1d2a4a 0%, transparent 60%),
      radial-gradient(900px 600px at 88% 110%, #14324a 0%, transparent 55%),
      var(--bg);
    display: grid; place-items: center;
  }
  .watermark { text-align: center; user-select: none; opacity: .5; }
  .wm-logo {
    width: 120px; height: 120px; margin: 0 auto 18px; border-radius: 30px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-weight: 800; font-size: 44px;
    letter-spacing: 1px; color: #0b1a2a; box-shadow: 0 16px 50px rgba(79, 209, 165, .22);
  }
  .wm-title { font-size: 40px; font-weight: 800; letter-spacing: -.5px; }
  .wm-sub { color: var(--muted); font-size: 20px; margin-top: 6px; }
  .wm-hint { color: var(--muted); font-size: 16px; margin-top: 26px; }

  /* ------------------------------------------------------------ taskbar */
  .taskbar {
    display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 14px;
    background: rgba(14, 19, 32, .92); border-top: 1px solid var(--line);
    position: relative; z-index: 30;
  }
  .start {
    display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer; font-weight: 700; font-size: 17px; color: var(--text);
  }
  .start:hover, .start:focus-visible, .start.on { border-color: var(--accent); outline: none; }
  .start.on { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
  .logo-xs {
    width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b1a2a; font-weight: 800; font-size: 12px; letter-spacing: .5px;
  }
  .tb-device { font-weight: 600; color: var(--muted); font-size: 15px; }
  .tb-spacer { flex: 1; }
  .tb-clock { text-align: right; line-height: 1.15; }
  .tb-clock .t { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tb-clock .d { font-size: 13px; color: var(--muted); }

  /* ------------------------------------------------------------ menu */
  .menu {
    position: absolute; left: 12px; bottom: 72px; z-index: 40;
    width: min(600px, calc(100vw - 24px)); max-height: calc(100vh - 96px);
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .5);
    transform-origin: bottom left; transition: transform .14s ease, opacity .14s ease;
  }
  .menu.closed { opacity: 0; transform: scale(.96) translateY(8px); pointer-events: none; }
  .menu-head {
    display: flex; align-items: center; gap: 14px; padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 10%, var(--panel)), var(--panel));
  }
  .logo-sm {
    width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b1a2a; font-weight: 800; font-size: 16px; letter-spacing: .5px;
  }
  .mh-title { font-size: 21px; font-weight: 800; }
  .mh-sub { color: var(--muted); font-size: 15px; }
  .mh-brand { margin-left: auto; text-align: right; color: var(--muted); font-size: 13px; line-height: 1.3; }
  .mh-brand b { color: var(--text); font-size: 14px; }

  .menu-apps { padding: 10px; overflow: auto; }
  .item {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px;
    text-decoration: none; color: var(--text); border: 1px solid transparent;
  }
  .item.sel {
    border-color: var(--c, var(--accent));
    background: linear-gradient(160deg, color-mix(in srgb, var(--c, var(--accent)) 14%, var(--panel)), var(--panel));
  }
  .item .icon {
    flex: 0 0 44px; width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c);
  }
  .item .icon svg { width: 24px; height: 24px; }
  .item .txt { flex: 1; min-width: 0; }
  .item .txt h2 { margin: 0; font-size: 18px; }
  .item .txt p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .menu-foot {
    padding: 12px 20px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 10px;
  }
</style>
</head>
<body>

<div class="desktop" id="desktop">
  <div class="watermark">
    <div class="wm-logo">SKM</div>
    <div class="wm-title">SKM Software</div>
    <div class="wm-sub" id="wmSub">ClassPi OS &middot; Computing Science</div>
    <div class="wm-hint">Open the <span class="kbd">Menu</span> for the classroom tools &middot; press <span class="kbd">Esc</span> any time</div>
  </div>
</div>

<div class="menu closed" id="menu">
  <div class="menu-head">
    <div class="logo-sm">SKM</div>
    <div>
      <div class="mh-title" id="deviceName">ClassPi</div>
      <div class="mh-sub" id="schoolName">Computing Science</div>
    </div>
    <div class="mh-brand"><b>SKM Software</b><br>ClassPi OS</div>
  </div>
  <nav class="menu-apps" id="apps"></nav>
  <div class="menu-foot">
    <span><span class="kbd">1</span>-<span class="kbd">7</span> open a tool &middot; <span class="kbd">&uarr;</span><span class="kbd">&darr;</span> + <span class="kbd">Enter</span> &middot; <span class="kbd">Esc</span> opens/closes</span>
    <span id="host"></span>
  </div>
</div>

<div class="taskbar">
  <button class="start" id="startBtn" aria-haspopup="true" aria-expanded="false">
    <span class="logo-xs">SKM</span> Menu
  </button>
  <span class="tb-device" id="tbDevice"></span>
  <div class="tb-spacer"></div>
  <div class="tb-clock"><div class="t" id="time">--:--</div><div class="d" id="date"></div></div>
</div>

<script src="/js/common.js"></script>
<script>
const APPS = [
  { href: "/apps/python.html", c: "#4fd1a5", name: "Python Lab", desc: "Write, run and save Python programs.",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 6 2 12 8 18"/><polyline points="16 6 22 12 16 18"/></svg>' },
  { href: "/apps/binary.html", c: "#5b9dff", name: "Binary Trainer", desc: "Binary, denary and two's complement practice.",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="6" height="16" rx="3"/><line x1="16" y1="4" x2="16" y2="20"/><polyline points="13 7 16 4"/></svg>' },
  { href: "/apps/algorithms.html", c: "#c792ea", name: "Algorithm Visualiser", desc: "Step through the SQA standard algorithms.",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="20" x2="5" y2="12"/><line x1="10" y1="20" x2="10" y2="6"/><line x1="15" y1="20" x2="15" y2="14"/><line x1="20" y1="20" x2="20" y2="9"/></svg>' },
  { href: "/apps/network.html", c: "#63d3ff", name: "Network Lab", desc: "Send messages between Pis, intercept and encrypt.",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="7" height="6" rx="1"/><rect x="15" y="3" width="7" height="6" rx="1"/><rect x="8.5" y="15" width="7" height="6" rx="1"/><path d="M5.5 9v3h13V9M12 12v3"/></svg>' },
  { href: "/apps/quiz.html", c: "#ffb547", name: "Revision Quiz", desc: "N5 and Higher questions by topic.",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>' },
  { href: "/apps/timer.html", c: "#ff7eb6", name: "Timer & Picker", desc: "Lesson countdown and random name picker.",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><polyline points="12 9 12 13 15 15"/><line x1="9" y1="2" x2="15" y2="2"/></svg>' },
  { href: "/apps/system.html", c: "#9aa7c2", name: "System", desc: "Pi health, updates and power options.",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="2" x2="9" y2="5"/><line x1="15" y1="2" x2="15" y2="5"/><line x1="9" y1="19" x2="9" y2="22"/><line x1="15" y1="19" x2="15" y2="22"/><line x1="2" y1="9" x2="5" y2="9"/><line x1="2" y1="15" x2="5" y2="15"/><line x1="19" y1="9" x2="22" y2="9"/><line x1="19" y1="15" x2="22" y2="15"/></svg>' },
];

const $ = (id) => document.getElementById(id);
const appsEl = $("apps");
APPS.forEach((a, i) => {
  const el = document.createElement("a");
  el.className = "item";
  el.href = a.href;
  el.style.setProperty("--c", a.c);
  el.innerHTML = `<span class="icon">${a.icon}</span>
    <span class="txt"><h2>${a.name}</h2><p>${a.desc}</p></span>
    <span class="kbd">${i + 1}</span>`;
  el.addEventListener("mouseenter", () => select(i));
  appsEl.appendChild(el);
});
const items = [...appsEl.children];

let sel = Number(sessionStorage.getItem("classpi-sel") || 0);
function select(i) {
  sel = (i + items.length) % items.length;
  items.forEach((el, j) => el.classList.toggle("sel", j === sel));
  items[sel].scrollIntoView({ block: "nearest" });
  try { sessionStorage.setItem("classpi-sel", sel); } catch (_) {}
}

let open = false;
function setMenu(o) {
  open = o;
  $("menu").classList.toggle("closed", !o);
  $("startBtn").classList.toggle("on", o);
  $("startBtn").setAttribute("aria-expanded", o);
  if (o) select(sel);
}
$("startBtn").addEventListener("click", () => setMenu(!open));
$("desktop").addEventListener("click", () => setMenu(false));

document.addEventListener("keydown", (e) => {
  if (/^[1-7]$/.test(e.key)) { location.href = APPS[e.key - 1].href; return; }
  if (e.key === "Escape" || e.key === "Meta") { e.preventDefault(); setMenu(!open); return; }
  if (!open) {
    if (e.key === "Enter" || e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); setMenu(true); }
    return;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowRight") select(sel + 1);
  else if (e.key === "ArrowUp" || e.key === "ArrowLeft") select(sel - 1);
  else if (e.key === "Enter") location.href = items[sel].href;
  else return;
  e.preventDefault();
});

function tick() {
  const now = new Date();
  $("time").textContent = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = now.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
tick(); setInterval(tick, 1000);

api("/api/info").then((i) => {
  $("deviceName").textContent = i.device_name;
  $("schoolName").textContent = i.school_name;
  $("wmSub").textContent = "ClassPi OS · " + i.school_name;
  $("tbDevice").textContent = i.device_name;
  $("host").textContent = i.hostname + " · ClassPi OS " + i.version;
  document.title = i.device_name;
}).catch(() => {});

setMenu(true);   // menu open on arrival so the tools are one keypress away
</script>
</body>
</html>
