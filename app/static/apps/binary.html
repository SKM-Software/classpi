<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binary Trainer - ClassPi</title>
<link rel="stylesheet" href="/css/classpi.css">
<style>
  .modes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .modes .btn.on { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 20%, var(--panel-2)); }
  .stage { display: grid; grid-template-columns: 1fr 300px; gap: 22px; }
  .question { font-size: 26px; margin: 0 0 20px; }
  .target { font-family: var(--mono); font-size: 64px; font-weight: 700; color: var(--accent-2); letter-spacing: 4px; margin: 0 0 24px; }
  .bits { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; margin-bottom: 22px; }
  .bit { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bit .place { font-family: var(--mono); color: var(--muted); font-size: 16px; }
  .bit .place.neg { color: var(--warn); }
  .bit button {
    width: 100%; aspect-ratio: 1; max-width: 96px; border-radius: 14px; border: 2px solid var(--line);
    background: var(--bg-2); font-family: var(--mono); font-size: 40px; font-weight: 700; cursor: pointer;
  }
  .bit button.one { background: color-mix(in srgb, var(--accent) 25%, var(--bg-2)); border-color: var(--accent); color: var(--accent); }
  .bit button:focus-visible { outline: 3px solid var(--accent-2); }
  .answer-row { display: flex; gap: 12px; align-items: center; }
  .answer-row input { font-size: 28px; font-family: var(--mono); width: 260px; }
  .feedback { min-height: 60px; margin-top: 18px; font-size: 20px; }
  .feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); }
  .working { font-family: var(--mono); font-size: 16px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; }
  .stat { font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stats .panel { margin-bottom: 16px; }
  .hint { font-size: 16px; }
</style>
</head>
<body>
<div class="topbar">
  <a class="home-btn" href="/">&larr; Home <span class="kbd">Esc</span></a>
  <h1>Binary Trainer</h1>
  <div class="spacer"></div>
  <span class="muted hint">Keys: <span class="kbd">1</span>-<span class="kbd">8</span> flip bits, <span class="kbd">Enter</span> check, <span class="kbd">N</span> next</span>
</div>

<div class="page">
  <div class="modes" id="modes">
    <button class="btn on" data-mode="to-denary">Binary &rarr; Denary</button>
    <button class="btn" data-mode="to-binary">Denary &rarr; Binary</button>
    <button class="btn" data-mode="twos-to-denary">Two's complement &rarr; Denary <span class="chip">Higher</span></button>
    <button class="btn" data-mode="denary-to-twos">Denary &rarr; Two's complement <span class="chip">Higher</span></button>
  </div>

  <div class="stage">
    <div class="panel">
      <p class="question" id="question"></p>
      <div class="target" id="target"></div>
      <div class="bits" id="bits"></div>
      <div class="answer-row" id="answerRow">
        <input type="text" id="answer" inputmode="numeric" autocomplete="off" placeholder="Your answer">
      </div>
      <div style="display:flex; gap:10px; margin-top:18px">
        <button class="btn primary" id="check">Check <span class="kbd">Enter</span></button>
        <button class="btn" id="next">Next <span class="kbd">N</span></button>
        <button class="btn" id="show">Show working</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="working" id="working"></div>
    </div>
    <div class="stats">
      <div class="panel"><div class="muted">Score</div><div class="stat" id="score">0 / 0</div></div>
      <div class="panel"><div class="muted">Streak</div><div class="stat" id="streak">0</div></div>
      <div class="panel"><div class="muted">Best streak</div><div class="stat" id="best">0</div></div>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
const PLACES = [128, 64, 32, 16, 8, 4, 2, 1];
const TWOS = [-128, 64, 32, 16, 8, 4, 2, 1];
let mode = "to-denary";
let value = 0;          // the number being asked about
let bits = [0,0,0,0,0,0,0,0];
let answered = false;
let score = 0, total = 0, streak = 0, best = 0;

const $ = (id) => document.getElementById(id);
const toBits = (n, twos) => {
  const u = twos && n < 0 ? 256 + n : n;
  return u.toString(2).padStart(8, "0").split("").map(Number);
};
const bitsValue = (b, twos) => b.reduce((acc, bit, i) => acc + bit * (twos ? TWOS : PLACES)[i], 0);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function renderBits(editable, twos) {
  const wrap = $("bits");
  wrap.innerHTML = "";
  const places = twos ? TWOS : PLACES;
  bits.forEach((b, i) => {
    const d = document.createElement("div");
    d.className = "bit";
    d.innerHTML = `<span class="place ${places[i] < 0 ? "neg" : ""}">${places[i]}</span><button class="${b ? "one" : ""}" ${editable ? "" : "disabled"}>${b}</button><span class="kbd">${i + 1}</span>`;
    if (editable) d.querySelector("button").onclick = () => flip(i);
    wrap.appendChild(d);
  });
}
function flip(i) {
  if (answered || !mode.startsWith("denary-") && mode !== "to-binary") return;
  bits[i] ^= 1;
  renderBits(true, mode === "denary-to-twos");
}

function newQuestion() {
  answered = false;
  $("feedback").textContent = ""; $("feedback").className = "feedback";
  $("working").textContent = "";
  $("answer").value = "";
  const twos = mode.includes("twos");
  if (twos) {
    value = rnd(-128, 127);
    if (Math.random() < 0.7 && value >= 0) value = -value || -1; // bias towards negatives
  } else {
    value = rnd(1, 255);
  }
  if (mode === "to-denary" || mode === "twos-to-denary") {
    $("question").textContent = twos ? "What denary number does this 8-bit two's complement pattern represent?" : "What is this binary number in denary?";
    $("target").textContent = toBits(value, twos).join("");
    bits = toBits(value, twos);
    renderBits(false, twos);
    $("answerRow").style.display = "";
    $("answer").focus();
  } else {
    $("question").textContent = twos ? "Set the bits to show this number in 8-bit two's complement:" : "Set the bits to show this number in 8-bit binary:";
    $("target").textContent = value;
    bits = [0,0,0,0,0,0,0,0];
    renderBits(true, twos);
    $("answerRow").style.display = "none";
    document.activeElement.blur();
  }
}

function working() {
  const twos = mode.includes("twos");
  const b = toBits(value, twos);
  const places = twos ? TWOS : PLACES;
  const parts = b.map((bit, i) => bit ? places[i] : null).filter((x) => x !== null);
  let text = `${b.join("")}\n= ${parts.join(" + ").replace(/\+ -/g, "- ") || "0"}\n= ${value}`;
  if (twos && value < 0) {
    const pos = toBits(-value, false).join("");
    const flipped = toBits(-value, false).map((x) => 1 - x).join("");
    text += `\n\nFlip-and-add-one method for ${value}:\n  +${-value} = ${pos}\n  flip   = ${flipped}\n  add 1  = ${b.join("")}`;
  }
  return text;
}

function check() {
  if (answered) { newQuestion(); return; }
  let correct;
  if (mode === "to-denary" || mode === "twos-to-denary") {
    const a = $("answer").value.trim();
    if (!/^-?\d+$/.test(a)) { $("feedback").textContent = "Type a whole number first."; return; }
    correct = Number(a) === value;
  } else {
    correct = bitsValue(bits, mode === "denary-to-twos") === value;
  }
  answered = true;
  total++;
  if (correct) { score++; streak++; best = Math.max(best, streak); }
  else streak = 0;
  $("feedback").className = "feedback " + (correct ? "good" : "bad");
  $("feedback").textContent = correct ? "Correct! Press Enter or N for the next one." : "Not quite - here's the working:";
  if (!correct) $("working").textContent = working();
  if (mode === "to-binary" || mode === "denary-to-twos") {
    bits = toBits(value, mode === "denary-to-twos");
    renderBits(false, mode === "denary-to-twos");
  }
  $("score").textContent = `${score} / ${total}`;
  $("streak").textContent = streak;
  $("best").textContent = best;
}

document.querySelectorAll("#modes .btn").forEach((b) => b.onclick = () => {
  document.querySelectorAll("#modes .btn").forEach((x) => x.classList.remove("on"));
  b.classList.add("on");
  mode = b.dataset.mode;
  newQuestion();
});
$("check").onclick = check;
$("next").onclick = newQuestion;
$("show").onclick = () => { $("working").textContent = working(); };
document.addEventListener("keydown", (e) => {
  const inAnswer = e.target === $("answer");
  if (e.key === "Enter") { e.preventDefault(); check(); }
  else if (!inAnswer && /^[1-8]$/.test(e.key)) flip(Number(e.key) - 1);
  else if (!inAnswer && (e.key === "n" || e.key === "N")) newQuestion();
});
newQuestion();
</script>
</body>
</html>
