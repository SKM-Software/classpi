<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer &amp; Picker - ClassPi</title>
<link rel="stylesheet" href="/css/classpi.css">
<style>
  .tabs { display: flex; gap: 10px; margin-bottom: 22px; }
  .tabs .btn.on { border-color: #ff7eb6; background: color-mix(in srgb, #ff7eb6 20%, var(--panel-2)); }
  .center { text-align: center; }
  .clock { font-size: 22vmin; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; margin: 10px 0; }
  .clock.warn { color: var(--warn); } .clock.done { color: var(--bad); }
  .presets { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
  .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .big { font-size: 22px; padding: 14px 28px; }
  #names { width: 100%; height: 160px; font-family: var(--mono); font-size: 18px; }
  .picked { font-size: 12vmin; font-weight: 800; color: #ff7eb6; min-height: 16vmin; display: grid; place-items: center; }
  .pool { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .pool span { padding: 6px 12px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
  .pool span.used { opacity: .35; text-decoration: line-through; }
  .hidden { display: none; }
  .progress-ring { transform: rotate(-90deg); }
</style>
</head>
<body>
<div class="topbar">
  <a class="home-btn" href="/">&larr; Home <span class="kbd">Esc</span></a>
  <h1>Timer &amp; Picker</h1>
  <div class="spacer"></div>
  <span class="muted" style="font-size:16px"><span class="kbd">Space</span> start/pause</span>
</div>

<div class="page center">
  <div class="tabs" style="justify-content:center">
    <button class="btn on" id="tabTimer">Countdown timer</button>
    <button class="btn" id="tabPicker">Random name picker</button>
  </div>

  <section id="timer">
    <div class="presets" id="presets"></div>
    <div class="clock" id="clock">05:00</div>
    <div class="controls">
      <button class="btn primary big" id="startBtn">Start</button>
      <button class="btn big" id="resetBtn">Reset</button>
      <button class="btn big" id="addBtn">+1 min</button>
      <label class="switch" style="display:inline-flex;align-items:center;gap:8px;margin-left:10px">
        <input type="checkbox" id="beep" checked> <span class="muted">Sound at 0</span>
      </label>
    </div>
  </section>

  <section id="picker" class="hidden">
    <div class="picked" id="picked">Add names, then pick</div>
    <div class="controls" style="margin-bottom:16px">
      <button class="btn primary big" id="pickBtn">Pick a name</button>
      <button class="btn big" id="resetPool">Reset pool</button>
      <label class="switch" style="display:inline-flex;align-items:center;gap:8px">
        <input type="checkbox" id="noRepeat" checked> <span class="muted">No repeats until all picked</span>
      </label>
    </div>
    <textarea id="names" placeholder="One name per line" spellcheck="false"></textarea>
    <div class="pool" id="pool"></div>
  </section>
</div>

<script src="/js/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);

// ---- tabs ----
function tab(which) {
  const t = which === "timer";
  $("timer").classList.toggle("hidden", !t);
  $("picker").classList.toggle("hidden", t);
  $("tabTimer").classList.toggle("on", t);
  $("tabPicker").classList.toggle("on", !t);
}
$("tabTimer").onclick = () => tab("timer");
$("tabPicker").onclick = () => tab("picker");

// ---- timer ----
let total = 300, remaining = 300, running = false, tick = null;
[1, 2, 5, 10, 15].forEach((m) => {
  const b = document.createElement("button");
  b.className = "btn"; b.textContent = m + " min";
  b.onclick = () => { total = remaining = m * 60; running = false; clearInterval(tick); paint(); };
  $("presets").appendChild(b);
});
function fmt(s) { const m = Math.floor(s / 60); return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function paint() {
  const c = $("clock");
  c.textContent = fmt(Math.max(0, remaining));
  c.className = "clock" + (remaining <= 0 ? " done" : remaining <= 30 ? " warn" : "");
  $("startBtn").textContent = running ? "Pause" : (remaining <= 0 ? "Start" : "Resume");
  if ($("startBtn").textContent === "Resume" && remaining === total) $("startBtn").textContent = "Start";
}
function start() {
  if (running) { running = false; clearInterval(tick); paint(); return; }
  if (remaining <= 0) remaining = total;
  running = true; paint();
  const end = Date.now() + remaining * 1000;
  tick = setInterval(() => {
    remaining = Math.round((end - Date.now()) / 1000);
    if (remaining <= 0) { remaining = 0; running = false; clearInterval(tick); if ($("beep").checked) beep(); }
    paint();
  }, 200);
}
$("startBtn").onclick = start;
$("resetBtn").onclick = () => { running = false; clearInterval(tick); remaining = total; paint(); };
$("addBtn").onclick = () => { total += 60; remaining += 60; paint(); };

function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < 3; i++) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      const t0 = ac.currentTime + i * 0.35;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      o.start(t0); o.stop(t0 + 0.3);
    }
  } catch (_) {}
}

// ---- picker ----
let used = [];
function names() { return $("names").value.split("\n").map((s) => s.trim()).filter(Boolean); }
function renderPool() {
  const all = names();
  $("pool").innerHTML = "";
  all.forEach((n) => {
    const s = document.createElement("span");
    s.textContent = n;
    if (used.includes(n)) s.classList.add("used");
    $("pool").appendChild(s);
  });
  try { localStorage.setItem("classpi-names", $("names").value); } catch (_) {}
}
function pick() {
  let pool = names();
  if ($("noRepeat").checked) {
    const left = pool.filter((n) => !used.includes(n));
    if (!left.length) { used = []; }
    pool = pool.filter((n) => !used.includes(n));
  }
  if (!pool.length) { $("picked").textContent = "Add some names first"; return; }
  let count = 0;
  const spin = setInterval(() => {
    $("picked").textContent = pool[Math.floor(Math.random() * pool.length)];
    if (++count > 12) {
      clearInterval(spin);
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      $("picked").textContent = chosen;
      if ($("noRepeat").checked) used.push(chosen);
      renderPool();
    }
  }, 70);
}
$("pickBtn").onclick = pick;
$("resetPool").onclick = () => { used = []; renderPool(); $("picked").textContent = "Pool reset"; };
$("names").addEventListener("input", () => { used = []; renderPool(); });
try { $("names").value = localStorage.getItem("classpi-names") || "Aisha\nCallum\nEilidh\nFinn\nIsla\nMorven\nRoss"; } catch (_) {}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === " ") { e.preventDefault(); if ($("timer").classList.contains("hidden")) pick(); else start(); }
});

renderPool();
paint();
</script>
</body>
</html>
