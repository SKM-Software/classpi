<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revision Quiz - ClassPi</title>
<link rel="stylesheet" href="/css/classpi.css">
<style>
  .page { max-width: 900px; }
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .topic { text-align: left; padding: 18px; }
  .topic h3 { margin: 0 0 6px; font-size: 20px; }
  .bar { height: 6px; border-radius: 3px; background: var(--panel-2); margin-top: 10px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; }
  .q { font-size: 28px; margin: 6px 0 24px; line-height: 1.35; }
  .options { display: grid; gap: 14px; }
  .option {
    text-align: left; padding: 18px 20px; font-size: 20px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--panel-2); cursor: pointer; display: flex; gap: 14px; align-items: center;
  }
  .option .letter { width: 34px; height: 34px; border-radius: 8px; background: var(--bg-2); display: grid; place-items: center; font-weight: 700; }
  .option:hover:not(:disabled), .option.sel { border-color: var(--accent-2); }
  .option.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 20%, var(--panel-2)); }
  .option.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 18%, var(--panel-2)); }
  .progress { color: var(--muted); margin-bottom: 8px; }
  .result { text-align: center; padding: 30px; }
  .result .big { font-size: 72px; font-weight: 800; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="topbar">
  <a class="home-btn" href="/">&larr; Home <span class="kbd">Esc</span></a>
  <h1>Revision Quiz</h1>
  <div class="spacer"></div>
  <span class="chip" id="topicChip"></span>
</div>

<div class="page">
  <div id="menu">
    <h2>Choose a topic</h2>
    <div class="topics" id="topics"></div>
  </div>

  <div id="quiz" class="hidden panel">
    <div class="progress" id="progress"></div>
    <p class="q" id="question"></p>
    <div class="options" id="options"></div>
    <div style="margin-top:22px; display:flex; justify-content:space-between; align-items:center">
      <span id="feedback" style="font-size:19px"></span>
      <button class="btn primary hidden" id="nextBtn">Next &rarr; <span class="kbd" style="background:transparent">Enter</span></button>
    </div>
  </div>

  <div id="done" class="hidden panel result">
    <div class="muted">You scored</div>
    <div class="big" id="finalScore"></div>
    <p id="finalMsg" style="font-size:20px"></p>
    <div style="display:flex; gap:12px; justify-content:center">
      <button class="btn primary" id="retryBtn">Try again</button>
      <button class="btn" id="menuBtn">Pick another topic</button>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let bank = { topics: {} };
let questions = [], idx = 0, score = 0, topicName = "", locked = false;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function progressKey(t) { return "classpi-quiz-" + t; }

function showMenu() {
  $("menu").classList.remove("hidden");
  $("quiz").classList.add("hidden");
  $("done").classList.add("hidden");
  $("topicChip").textContent = "";
  const wrap = $("topics"); wrap.innerHTML = "";
  Object.entries(bank.topics).forEach(([name, qs]) => {
    const best = Number(localStorage.getItem(progressKey(name)) || 0);
    const b = document.createElement("button");
    b.className = "btn topic";
    b.innerHTML = `<h3>${name}</h3><span class="muted">${qs.length} questions</span>
      <div class="bar"><div style="width:${best}%"></div></div>
      <span class="muted" style="font-size:14px">${best ? "Best: " + best + "%" : "Not tried yet"}</span>`;
    b.onclick = () => start(name);
    wrap.appendChild(b);
  });
}

function start(name) {
  topicName = name;
  questions = shuffle(bank.topics[name].map((q) => ({ ...q })));
  idx = 0; score = 0;
  $("menu").classList.add("hidden");
  $("done").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("topicChip").textContent = name;
  render();
}

function render() {
  locked = false;
  const q = questions[idx];
  $("progress").textContent = `Question ${idx + 1} of ${questions.length}  -  Score: ${score}`;
  $("question").textContent = q.q;
  $("feedback").textContent = "";
  $("nextBtn").classList.add("hidden");
  const opts = $("options"); opts.innerHTML = "";
  const order = shuffle(q.a.map((text, i) => ({ text, i })));
  order.forEach((o, pos) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = `<span class="letter">${"ABCD"[pos]}</span><span></span>`;
    b.lastChild.textContent = o.text;
    b.onclick = () => choose(b, o.i === q.correct, opts, q.correct, order);
    opts.appendChild(b);
  });
}

function choose(btn, isCorrect, opts, correctIdx, order) {
  if (locked) return;
  locked = true;
  [...opts.children].forEach((c, pos) => {
    c.disabled = true;
    if (order[pos].i === correctIdx) c.classList.add("correct");
  });
  if (isCorrect) { score++; $("feedback").textContent = "Correct!"; $("feedback").style.color = "var(--good)"; }
  else { btn.classList.add("wrong"); $("feedback").textContent = "Not quite - the correct answer is highlighted."; $("feedback").style.color = "var(--bad)"; }
  const nb = $("nextBtn");
  nb.textContent = idx + 1 < questions.length ? "Next" : "See results";
  nb.classList.remove("hidden");
  nb.focus();
}

function next() {
  if (!locked) return;
  idx++;
  if (idx < questions.length) render();
  else finish();
}

function finish() {
  const pct = Math.round((score / questions.length) * 100);
  const best = Number(localStorage.getItem(progressKey(topicName)) || 0);
  if (pct > best) localStorage.setItem(progressKey(topicName), pct);
  $("quiz").classList.add("hidden");
  $("done").classList.remove("hidden");
  $("finalScore").textContent = `${score} / ${questions.length}`;
  const msg = pct === 100 ? "Full marks - excellent!" : pct >= 70 ? "Good work. A quick review and you're there." : pct >= 40 ? "Getting there - go over this topic and try again." : "Worth revising this topic and having another go.";
  $("finalMsg").textContent = `${pct}%. ${msg}`;
}

$("nextBtn").onclick = next;
$("retryBtn").onclick = () => start(topicName);
$("menuBtn").onclick = showMenu;
document.addEventListener("keydown", (e) => {
  if (!$("quiz").classList.contains("hidden")) {
    if (/^[1-4]$/.test(e.key)) { const b = $("options").children[e.key - 1]; if (b && !b.disabled) b.click(); }
    else if (e.key === "Enter") next();
  }
});

api("/api/quiz").then((data) => { bank = data; showMenu(); })
  .catch(() => { $("topics").innerHTML = '<p class="muted">Could not load questions.</p>'; });
</script>
</body>
</html>
