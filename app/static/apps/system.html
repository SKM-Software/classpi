<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System - ClassPi</title>
<link rel="stylesheet" href="/css/classpi.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
  .stat { padding: 20px; }
  .stat .k { color: var(--muted); font-size: 15px; text-transform: uppercase; letter-spacing: .5px; }
  .stat .v { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .stat .sub { color: var(--muted); font-size: 15px; }
  .meter { height: 8px; border-radius: 4px; background: var(--panel-2); margin-top: 10px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--accent); transition: width .4s; }
  .meter > div.warn { background: var(--warn); } .meter > div.bad { background: var(--bad); }
  .power { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; place-items: center; z-index: 50; }
  .modal.open { display: grid; }
  .modal .panel { width: min(420px, 92vw); }
  .modal input { width: 100%; font-size: 28px; text-align: center; letter-spacing: 8px; font-family: var(--mono); margin: 14px 0; }

  /* Wi-Fi */
  .net {
    display: flex; align-items: center; gap: 14px; padding: 10px 14px; margin-top: 8px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2);
  }
  .net .sig { color: var(--accent); flex: 0 0 auto; }
  .net.weak .sig { color: var(--warn); }
  .net.active { border-color: var(--accent); }
  .net .name { flex: 1; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .net .name small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
  #wifiModal .panel { width: min(520px, 92vw); }
  #wifiModal label { display: block; margin-top: 12px; color: var(--muted); font-size: 14px; }
  #wifiModal label.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 15px; }
  #wifiModal input { font-size: 18px; text-align: left; letter-spacing: 0; font-family: var(--sans); margin: 4px 0 0; }
  #wifiModal input[type=checkbox] { width: auto; margin: 0; }
</style>
</head>
<body>
<div class="topbar">
  <a class="home-btn" href="/">&larr; Home <span class="kbd">Esc</span></a>
  <h1>System</h1>
  <div class="spacer"></div>
  <span class="chip" id="model">Raspberry Pi</span>
</div>

<div class="page">
  <div class="grid" id="stats"></div>

  <div class="panel" style="margin-top:22px" id="wifiPanel">
    <h2 style="margin-top:0">Wi-Fi</h2>
    <p class="muted" id="wifiNow">Checking...</p>
    <div class="power">
      <button class="btn" id="wifiScan">Scan for networks</button>
      <button class="btn primary" id="wifiOn" style="display:none">Turn Wi-Fi on</button>
      <button class="btn" id="wifiOther">Other network...</button>
      <button class="btn primary" id="wifiSignin" style="display:none">Sign in to this Wi-Fi</button>
      <button class="btn" id="wifiForget" style="display:none">Forget this network</button>
    </div>
    <p class="muted" id="wifiMsg" style="min-height:22px;font-size:15px"></p>
    <div id="wifiList"></div>
  </div>

  <div class="panel" style="margin-top:22px">
    <h2 style="margin-top:0">Software update</h2>
    <p class="muted" id="updStatus">Checks the SKM-Software GitHub repository for a newer version of ClassPi.</p>
    <div class="power">
      <button class="btn" id="updCheck">Check for updates</button>
      <button class="btn primary" id="updGo" disabled>Install update</button>
    </div>
  </div>

  <div class="panel" style="margin-top:22px">
    <h2 style="margin-top:0">Power &amp; kiosk</h2>
    <p class="muted">Each of these asks "Are you sure?" before it runs.</p>
    <div class="power">
      <button class="btn" data-action="exit_kiosk">Exit to console</button>
      <button class="btn" data-action="reboot">Restart Pi</button>
      <button class="btn danger" data-action="shutdown">Shut down Pi</button>
    </div>
  </div>
</div>

<div class="modal" id="wifiModal">
  <div class="panel">
    <h2 style="margin-top:0" id="wifiTitle">Connect to Wi-Fi</h2>
    <label for="wifiSsid">Network name</label>
    <input type="text" id="wifiSsid" maxlength="32" autocomplete="off">
    <label class="check" id="wifiHiddenRow"><input type="checkbox" id="wifiHidden"> Hidden network (does not show up in scans)</label>
    <label class="check" id="wifiEntRow"><input type="checkbox" id="wifiEnt"> Needs a username as well (school / enterprise login)</label>
    <div id="wifiUserRow">
      <label for="wifiUser">Username</label>
      <input type="text" id="wifiUser" autocomplete="off">
    </div>
    <div id="wifiPassRow">
      <label for="wifiPass">Password</label>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <input type="password" id="wifiPass" autocomplete="off" style="flex:1">
        <button class="btn" type="button" id="wifiShow">Show</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn primary" id="wifiGo" style="flex:1">Connect</button>
      <button class="btn" id="wifiCancel">Cancel</button>
    </div>
    <p class="muted" id="wifiErr" style="min-height:22px"></p>
  </div>
</div>

<div class="modal" id="confirmModal">
  <div class="panel">
    <h2 style="margin-top:0" id="confirmTitle">Are you sure?</h2>
    <div style="display:flex; gap:10px">
      <button class="btn primary" id="confirmOk" style="flex:1">Yes, go ahead</button>
      <button class="btn" id="confirmCancel">Cancel</button>
    </div>
    <p class="muted" id="confirmErr" style="min-height:22px"></p>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let pending = null;

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return (d ? d + "d " : "") + (h ? h + "h " : "") + m + "m";
}
function meter(pct) {
  const cls = pct > 85 ? "bad" : pct > 65 ? "warn" : "";
  return `<div class="meter"><div class="${cls}" style="width:${Math.min(100, pct)}%"></div></div>`;
}

async function refresh() {
  let s;
  try { s = await api("/api/system"); }
  catch (_) { $("stats").innerHTML = '<div class="stat panel muted">Could not read system info.</div>'; return; }
  $("model").textContent = s.model;
  const memPct = s.mem_total_mb ? Math.round((s.mem_used_mb / s.mem_total_mb) * 100) : 0;
  const diskPct = s.disk_total_gb ? Math.round((s.disk_used_gb / s.disk_total_gb) * 100) : 0;
  const tempPct = s.temp_c ? Math.round((s.temp_c / 85) * 100) : 0;
  const cards = [
    ["Temperature", s.temp_c != null ? s.temp_c + " &deg;C" : "n/a", s.temp_c != null ? (s.temp_c < 60 ? "Healthy" : s.temp_c < 75 ? "Warm" : "Hot - check cooling") : "", tempPct],
    ["Memory", memPct + "%", `${s.mem_used_mb} / ${s.mem_total_mb} MB`, memPct],
    ["Disk", diskPct + "%", `${s.disk_used_gb} / ${s.disk_total_gb} GB`, diskPct],
    ["CPU load", (s.load ? s.load[0] : 0).toFixed(2), `${s.cpu_count} cores - 1/5/15 min: ${(s.load || []).join(", ")}`, s.cpu_count ? Math.round((s.load[0] / s.cpu_count) * 100) : 0],
    ["Uptime", fmtUptime(s.uptime_seconds), "since last restart", null],
    ["Network", s.ip, "hostname: " + s.hostname, null],
  ];
  $("stats").innerHTML = cards.map(([k, v, sub, pct]) =>
    `<div class="stat panel"><div class="k">${k}</div><div class="v">${v}</div><div class="sub">${sub}</div>${pct != null ? meter(pct) : ""}</div>`
  ).join("");
}

function askConfirm(action, title) {
  pending = action;
  $("confirmTitle").textContent = title;
  $("confirmErr").textContent = "";
  $("confirmModal").classList.add("open");
  setTimeout(() => $("confirmOk").focus(), 50);
}
function closeConfirm() { $("confirmModal").classList.remove("open"); pending = null; }

async function doConfirmed() {
  if (!pending) return;
  if (pending === "update") { return confirmUpdate(); }
  const labels = { reboot: "Restarting...", shutdown: "Shutting down...", exit_kiosk: "Exiting kiosk..." };
  try {
    await api("/api/system/action", { method: "POST", body: { action: pending } });
    $("confirmErr").style.color = "var(--good)";
    $("confirmErr").textContent = labels[pending] || "Done";
    setTimeout(closeConfirm, 1500);
  } catch (err) {
    $("confirmErr").style.color = "var(--bad)";
    $("confirmErr").textContent = "Could not do that: " + err.message;
  }
}

// ---- software update ----
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

$("updCheck").onclick = async () => {
  const s = $("updStatus");
  s.textContent = "Checking...";
  $("updGo").disabled = true;
  try {
    const r = await api("/api/system/update/check");
    if (r.behind > 0) {
      s.textContent = `Update available: ${r.latest} (${r.behind} change${r.behind === 1 ? "" : "s"} behind). ` +
                      `Currently on ${r.current}.`;
      $("updGo").disabled = false;
    } else {
      s.textContent = `Up to date - running ${r.current}.`;
    }
  } catch (err) {
    s.textContent = "Could not check: " + err.message;
  }
};

$("updGo").onclick = () => askConfirm("update", "Install the update now?");

async function confirmUpdate() {
  $("confirmErr").style.color = "var(--muted)";
  $("confirmErr").textContent = "Updating...";
  try {
    await api("/api/system/update", { method: "POST", body: {} });
  } catch (err) {
    $("confirmErr").style.color = "var(--bad)";
    $("confirmErr").textContent = "Update failed: " + err.message;
    return;
  }
  closeConfirm();
  $("updGo").disabled = true;
  const s = $("updStatus");
  s.textContent = "Installing - the app restarts itself, then this page reloads...";
  await sleep(12000);                    // let the copy + service restart happen
  for (let i = 0; i < 30; i++) {         // then wait for the server to come back
    try { await api("/api/info"); location.reload(); return; }
    catch (_) { await sleep(2000); }
  }
  s.textContent = "The server has not come back yet - check it over SSH (journalctl -u classpi -e).";
}

// ---- wi-fi ----
let wifiStatus = null;

function sigBars(pct) {
  const n = pct >= 75 ? 4 : pct >= 50 ? 3 : pct >= 25 ? 2 : 1;
  return `<svg class="sig" viewBox="0 0 22 14" width="28" height="18" aria-label="signal ${pct}%">` +
    [0, 1, 2, 3].map((i) => `<rect x="${i * 6}" y="${14 - (4 + i * 3)}" width="4" height="${4 + i * 3}" rx="1" fill="currentColor" opacity="${i < n ? 1 : .22}"/>`).join("") +
    `</svg>`;
}

async function wifiRefresh() {
  let s;
  try { s = await api("/api/wifi/status"); }
  catch (err) { $("wifiNow").textContent = "Could not read the Wi-Fi status: " + err.message; return; }
  wifiStatus = s;
  const now = $("wifiNow");
  $("wifiOn").style.display = "none";
  $("wifiForget").style.display = "none";
  $("wifiSignin").style.display = "none";
  if (s.radio === "none") {
    now.textContent = s.error || "No Wi-Fi hardware found.";
    ["wifiScan", "wifiOther"].forEach((id) => { $(id).disabled = true; });
    return;
  }
  if (s.radio !== "on") {
    now.textContent = s.radio === "blocked"
      ? `Wi-Fi is blocked - usually because no country has been set yet. Turning it on sets the country (${s.country}) and enables the radio.`
      : "Wi-Fi is switched off.";
    $("wifiOn").style.display = "";
  } else if (s.connected) {
    now.innerHTML = `Connected to <b>${escapeHtml(s.connected.ssid)}</b>` +
      (s.connected.ip ? ` &middot; address <b>${escapeHtml(s.connected.ip)}</b>` : "") +
      (s.connected.signal != null ? ` &middot; signal ${s.connected.signal}%` : "");
    if (s.internet === "portal") {
      now.innerHTML += `<br><span style="color:var(--warn)">This network needs you to sign in (accept its terms on a web page) before it gives internet access.</span>`;
      $("wifiSignin").style.display = "";
    } else if (s.internet === "offline") {
      now.innerHTML += `<br><span style="color:var(--warn)">Connected, but the internet cannot be reached through this network.</span>`;
    }
    $("wifiForget").style.display = "";
  } else {
    now.textContent = "Wi-Fi is on but not connected to a network.";
  }
  if (!s.available) {
    $("wifiMsg").textContent = "This Pi was set up before Wi-Fi settings existed - to connect, run 'sudo bash install.sh' again (see INSTALL.md).";
  }
}

async function wifiScanNets() {
  const btn = $("wifiScan"), list = $("wifiList");
  btn.disabled = true;
  $("wifiMsg").textContent = "Scanning - this takes a few seconds...";
  let r;
  try { r = await api("/api/wifi/scan", { method: "POST", body: {} }); }
  catch (err) { $("wifiMsg").textContent = "Could not scan: " + err.message; btn.disabled = false; return; }
  btn.disabled = false;
  const n = r.networks.length;
  $("wifiMsg").textContent = n ? `${n} network${n === 1 ? "" : "s"} in range` : "No networks found - is the Wi-Fi switched on?";
  list.innerHTML = r.networks.map((net, i) => `
    <div class="net${net.active ? " active" : ""}${net.signal < 40 ? " weak" : ""}">
      ${sigBars(net.signal)}
      <span class="name">${escapeHtml(net.ssid)}<small>${net.secure ? escapeHtml(net.security) : "Open network"}${net.enterprise ? " - needs a username" : ""}${net.saved ? " - saved" : ""}</small></span>
      ${net.active ? '<span class="chip">connected</span>' : `<button class="btn" data-net="${i}">Connect</button>`}
    </div>`).join("");
  list.querySelectorAll("[data-net]").forEach((b) => { b.onclick = () => openWifiModal(r.networks[b.dataset.net]); });
}

function syncEnt() { $("wifiUserRow").style.display = $("wifiEnt").checked ? "" : "none"; }

function openWifiModal(net) {
  const manual = !net;
  $("wifiTitle").textContent = manual ? "Connect to another network" : "Connect to " + net.ssid;
  $("wifiSsid").value = manual ? "" : net.ssid;
  $("wifiSsid").readOnly = !manual;
  $("wifiHiddenRow").style.display = manual ? "" : "none";
  $("wifiHidden").checked = false;
  $("wifiEntRow").style.display = manual ? "" : "none";
  $("wifiEnt").checked = manual ? false : net.enterprise;
  $("wifiPassRow").style.display = (manual || net.secure) ? "" : "none";
  $("wifiUser").value = ""; $("wifiPass").value = "";
  $("wifiPass").type = "password"; $("wifiShow").textContent = "Show";
  $("wifiErr").textContent = "";
  syncEnt();
  $("wifiModal").classList.add("open");
  const first = manual ? "wifiSsid" : !net.secure ? "wifiGo" : net.enterprise ? "wifiUser" : "wifiPass";
  setTimeout(() => $(first).focus(), 50);
}
function closeWifi() { $("wifiModal").classList.remove("open"); }

$("wifiGo").onclick = async () => {
  const body = {
    ssid: $("wifiSsid").value.trim(),
    password: $("wifiPassRow").style.display === "none" ? "" : $("wifiPass").value,
    username: $("wifiEnt").checked ? $("wifiUser").value.trim() : "",
    hidden: $("wifiHidden").checked,
  };
  if (!body.ssid) { $("wifiErr").textContent = "Enter the network name."; return; }
  $("wifiGo").disabled = true;
  $("wifiErr").style.color = "var(--muted)";
  $("wifiErr").textContent = "Connecting - this can take up to a minute...";
  try {
    const r = await api("/api/wifi/connect", { method: "POST", body });
    $("wifiErr").style.color = "var(--good)";
    $("wifiErr").textContent = (r.message || "Connected") + (r.ip && r.ip !== "not connected" ? " - address " + r.ip : "");
    if (r.internet === "portal") {
      $("wifiErr").style.color = "var(--warn)";
      $("wifiErr").textContent = "Connected - this network needs you to sign in. Opening its sign-in page...";
      setTimeout(openPortal, 800);
    }
    setTimeout(() => { closeWifi(); wifiRefresh(); wifiScanNets(); }, 1500);
  } catch (err) {
    $("wifiErr").style.color = "var(--bad)";
    $("wifiErr").textContent = err.message;
  }
  $("wifiGo").disabled = false;
};

// The sign-in page opens in the Web Browser window; once it is accepted, close
// the browser (Back to ClassPi, or Ctrl+Shift+W) and the warning clears itself.
async function openPortal() {
  $("wifiMsg").textContent = "Opening the sign-in page...";
  try {
    await api("/api/browser/open", { method: "POST", body: { portal: true } });
    $("wifiMsg").textContent = "Sign in on the page that opened, then close the browser to come back here.";
  } catch (err) {
    $("wifiMsg").textContent = "Could not open the sign-in page: " + err.message;
  }
}
$("wifiSignin").onclick = openPortal;

$("wifiEnt").addEventListener("change", syncEnt);
$("wifiShow").onclick = () => {
  const p = $("wifiPass");
  p.type = p.type === "password" ? "text" : "password";
  $("wifiShow").textContent = p.type === "password" ? "Show" : "Hide";
};
$("wifiCancel").onclick = closeWifi;
$("wifiModal").querySelectorAll("input").forEach((i) => i.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("wifiGo").click(); }
  if (e.key === "Escape") { e.stopPropagation(); closeWifi(); }
}));
$("wifiScan").onclick = wifiScanNets;
$("wifiOther").onclick = () => openWifiModal(null);
$("wifiOn").onclick = async () => {
  $("wifiMsg").textContent = "Turning Wi-Fi on...";
  try {
    const r = await api("/api/wifi/on", { method: "POST", body: {} });
    $("wifiMsg").textContent = r.message || "Wi-Fi is on";
    wifiRefresh(); wifiScanNets();
  } catch (err) { $("wifiMsg").textContent = err.message; }
};
$("wifiForget").onclick = async () => {
  if (!wifiStatus || !wifiStatus.connected) return;
  const ssid = wifiStatus.connected.ssid;
  $("wifiMsg").textContent = `Forgetting "${ssid}"...`;
  try {
    const r = await api("/api/wifi/forget", { method: "POST", body: { ssid } });
    $("wifiMsg").textContent = r.message || "Forgotten";
    wifiRefresh();
  } catch (err) { $("wifiMsg").textContent = err.message; }
};
wifiRefresh();
setInterval(wifiRefresh, 15000);

document.querySelectorAll("[data-action]").forEach((b) => b.onclick = () => {
  const titles = { reboot: "Restart this Pi?", shutdown: "Shut down this Pi?", exit_kiosk: "Exit to the console (login prompt)?" };
  askConfirm(b.dataset.action, titles[b.dataset.action]);
});
$("confirmOk").onclick = doConfirmed;
$("confirmCancel").onclick = closeConfirm;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("confirmModal").classList.contains("open")) closeConfirm();
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
